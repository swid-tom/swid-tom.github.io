<!-- footer -->
<footer class="bg-dark footer-section">
  <div class="section">
    <div class="container">
      <div class="row">
        <div class="col-md-4">
          <h5 class="text-light">Email</h5>
          <p class="text-white paragraph-lg font-secondary">{{ site.data.settings.email }}</p>
        </div>
        <div class="col-md-4">
          <h5 class="text-light">Location</h5>
          <p class="text-white paragraph-lg font-secondary">{{ site.data.settings.address }}</p>
        </div>
      </div>
    </div>
  </div>

  <!-- social icons (moved from hero) -->
  <style>
    /* Make social icons larger, add white circular outline, and nudge up slightly */
    .social-icons li a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 48px;
      height: 48px;
      border: 2px solid #fff;
      border-radius: 50%;
      color: #fff;
      text-decoration: none;
      transition: transform .15s ease, background .15s ease;
    }
    .social-icons li a:hover { transform: translateY(-2px) scale(1.05); }
    .social-icons li a i {
      font-size: 1.25rem;
      line-height: 1;
      display: inline-block;
      transform: translateY(-2px);
    }
    @media (max-width: 576px) {
      .social-icons li a { width: 40px; height: 40px; }
      .social-icons li a i { font-size: 1.1rem; }
    }
  </style>
  <div class="container">
    <div class="row mt-4">
      <div class="col-12 text-center">
        <ul class="list-inline social-icons">
          {% for social in site.data.settings.social %}
          <li class="list-inline-item mx-2"><a class="text-white" href="{{ social.link }}"><i class="{{ social.icon }}"></i></a></li>
          {% endfor %}
        </ul>
      </div>
    </div>
  </div>

  <div class="border-top text-center border-dark py-5">
    <p class="mb-0 text-light">{{site.data.settings.copyright | markdownify}}</p>
  </div>
</footer>
<!-- /footer -->


<!-- JS Plugins -->
{% for js in site.data.plugins.js %}
<script src="{{ js | relative_url }}"></script>
{% endfor %}

<!-- Main Script -->
<script src="{{ '/assets/js/script.js' | relative_url }}"></script>
