<!-- footer -->
<footer class="bg-dark footer-section">
  <div class="section">
    <div class="container">
      <div class="row">
        <div class="col-md-4">
          <h5 class="text-light">Email</h5>
          <p class="text-white paragraph-lg font-secondary">{{ site.data.settings.email }}</p>
        </div>
        <div class="col-md-4">
          <h5 class="text-light">Location</h5>
          <p class="text-white paragraph-lg font-secondary">{{ site.data.settings.address }}</p>
        </div>
      </div>
    </div>
  </div>

  <!-- social icons (moved from hero) -->
  <style>
    /* Make social icons larger and nudge them up slightly */
    .social-icons li a i { font-size: 1.75rem; display: inline-block; transform: translateY(-6px); }
    .social-icons li a { line-height: 1; }
  </style>
  <div class="container">
    <div class="row mt-4">
      <div class="col-12 text-center">
        <ul class="list-inline social-icons">
          {% for social in site.data.settings.social %}
          <li class="list-inline-item mx-2"><a class="text-white" href="{{ social.link }}"><i class="{{ social.icon }}"></i></a></li>
          {% endfor %}
        </ul>
      </div>
    </div>
  </div>

  <div class="border-top text-center border-dark py-5">
    <p class="mb-0 text-light">{{site.data.settings.copyright | markdownify}}</p>
  </div>
</footer>
<!-- /footer -->


<!-- JS Plugins -->
{% for js in site.data.plugins.js %}
<script src="{{ js | relative_url }}"></script>
{% endfor %}

<!-- Main Script -->
<script src="{{ '/assets/js/script.js' | relative_url }}"></script>
